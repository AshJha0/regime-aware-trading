name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  guard:
    name: banned-word guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pattern is split so that this file does not match itself.
      - name: Fail if the banned word appears in tracked files
        run: |
          if git grep -n -i -e "inter""view"; then
            echo "::error::banned word found in tracked files"
            exit 1
          fi

  python:
    name: python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      # hmmlearn is installed, so the oracle test must run: any skip is a failure.
      - name: Run tests, failing on any skip
        working-directory: python
        run: |
          python -m pytest -rs | tee "$RUNNER_TEMP/pytest.log"
          if grep -q '^SKIPPED' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::a test was skipped"
            exit 1
          fi

  cpp:
    name: c++ release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev cmake
      - run: bash cpp/build.sh
      - run: ctest --test-dir cpp/build --output-on-failure

  cpp-sanitizers:
    name: c++ asan + ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libgtest-dev cmake
      - name: Configure and build
        run: |
          cmake -S cpp -B cpp/build-san -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          cmake --build cpp/build-san -j2
      - run: ctest --test-dir cpp/build-san --output-on-failure
        env:
          UBSAN_OPTIONS: print_stacktrace=1

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo test --release --locked
        working-directory: rust
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: rust

  java:
    name: java 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y junit4 libhamcrest-java
      - run: bash java/build.sh
      - run: bash java/test.sh

  cookbook:
    name: cookbook snippets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install toolchains and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev cmake junit4 libhamcrest-java
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          pip install -r python/requirements.txt
      - name: Build native libraries
        run: |
          bash cpp/build.sh
          (cd rust && cargo build --release --locked)
          bash java/build.sh
      - run: python tools/check_cookbook.py
